<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Alumnos - Educación Continua UPM</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --upm-red: #ae2d46;
        --upm-gold: #c39a5c;
        --bg: #f4f7f6;
        --text: #333;
        --border: #ddd;
      }
      body {
        font-family: "Open Sans", sans-serif;
        padding: 20px;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--upm-red);
        padding-bottom: 15px;
        margin-bottom: 20px;
      }
      .header h1 {
        color: var(--upm-red);
        margin: 0;
        font-size: 24px;
      }

      /* Toolbar de controles */
      .toolbar {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        background: #fff;
        padding: 15px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .toolbar input, .toolbar select {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        flex: 1;
        min-width: 150px;
        font-family: inherit;
        font-size: 14px;
      }
      .search-box { flex: 2; min-width: 250px !important; }

      /* Tabla */
      .table-container {
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        background-color: var(--upm-red);
        color: white;
        padding: 12px 15px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        transition: background 0.2s;
      }
      th:hover { background-color: #8c2335; }
      th span.sort-icon { font-size: 10px; margin-left: 5px; color: #ffcccc; }
      
      td {
        padding: 12px 15px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        vertical-align: middle;
      }
      tr:hover { background-color: #f9f9f9; }

      /* ESTILO: Fila Sin Archivos */
      tr.row-missing-files {
        background-color: #fffafa;
        border-left: 4px solid #ff4d4d;
      }
      tr.row-missing-files:hover { background-color: #ffe6e6; }
      
      .btn-missing {
        background-color: #ffeeee;
        color: #cc0000;
        border: 1px dashed #cc0000 !important;
        cursor: not-allowed;
      }

      /* Semáforos y Badges */
      .badge {
        padding: 4px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        display: inline-block;
        white-space: nowrap;
      }
      .badge-green { background-color: #e3fbed; color: #107c41; border: 1px solid #107c41; }
      .badge-yellow { background-color: #fff4ce; color: #9a6a00; border: 1px solid #9a6a00; }
      .badge-blue { background-color: #e1f0fa; color: #005a9e; border: 1px solid #005a9e; }
      .badge-red { background-color: #fde7e9; color: #d13438; border: 1px solid #d13438; }

      /* Botones */
      .btn {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 12px;
        transition: 0.2s;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }
      .btn-drive { background-color: #ffbb24; color: #333; }
      .btn-drive:hover { background-color: #e5a720; }
      .btn-edit { background-color: #e0e0e0; color: #333; margin-left: 5px; }
      .btn-edit:hover { background-color: #ccc; }
      .btn-save { background-color: var(--upm-red); color: white; padding: 10px 20px; width: 100%; font-size: 14px; margin-top: 10px;}

      /* Modal de Edición */
      .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.6); display: none; justify-content: center;
        align-items: center; z-index: 1000; backdrop-filter: blur(2px);
      }
      .modal {
        background: #fff; padding: 25px 30px; border-radius: 8px;
        width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .modal h2 { margin-top: 0; color: var(--upm-red); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
      .form-group { margin-bottom: 15px; }
      .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
      .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px; }
      .close-btn { background: none; border: none; color: #999; float: right; font-size: 24px; cursor: pointer; margin-top: -5px; }
      .close-btn:hover { color: #333; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Monitor de Registros - Educación Continua</h1>
      <span id="contador" class="badge badge-blue">Sincronizando...</span>
    </div>

    <!-- Buscador y Filtros Dinámicos -->
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-box" placeholder="Buscar por nombre, ID, matrícula, teléfono..." onkeyup="procesarFiltros()" />
      
      <select id="filterCurso" onchange="procesarFiltros()">
        <option value="ALL">Todos los Cursos</option>
      </select>

      <select id="filterStatus" onchange="procesarFiltros()">
        <option value="ALL">Todos los Estatus</option>
      </select>

      <select id="filterAsesor" onchange="procesarFiltros()">
        <option value="ALL">Todos los Asesores</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th onclick="cambiarOrden('idRegistro')">ID Solicitud <span class="sort-icon" id="sort-idRegistro"></span></th>
            <th onclick="cambiarOrden('nombreCompleto')">Nombre del Alumno <span class="sort-icon" id="sort-nombreCompleto"></span></th>
            <th onclick="cambiarOrden('matricula')">Estado Matrícula <span class="sort-icon" id="sort-matricula"></span></th>
            <th onclick="cambiarOrden('curso')">Curso / Diplomado <span class="sort-icon" id="sort-curso"></span></th>
            <th onclick="cambiarOrden('status')">Estatus <span class="sort-icon" id="sort-status"></span></th>
            <th onclick="cambiarOrden('fecha')">Fecha Registro <span class="sort-icon" id="sort-fecha">▼</span></th>
            <th onclick="cambiarOrden('asesor')">Asesor <span class="sort-icon" id="sort-asesor"></span></th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="8" style="text-align:center; padding: 30px; color:#666;">Cargando base de datos desde Sheets...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- MODAL DE EDICIÓN MEJORADO -->
    <div id="editModal" class="modal-overlay">
      <div class="modal">
        <button class="close-btn" onclick="cerrarModal()">×</button>
        <h2>Editar Registro Alumno</h2>
        <form id="editForm" onsubmit="guardarEdicion(event)">
          <input type="hidden" id="edit-id" />

          <div class="form-group">
            <label>ID y Nombre (Solo lectura)</label>
            <input type="text" id="edit-nombre" disabled style="background: #f0f0f0; color:#555;" />
          </div>

          <div class="form-group">
            <label>Matrícula Oficial</label>
            <input type="text" id="edit-matricula" placeholder="Ej. 20261020 o dejar vacío" />
          </div>

          <div class="form-group">
            <label>Estatus de Ingreso</label>
            <select id="edit-status">
              <option value="Nuevo Ingreso">Nuevo Ingreso</option>
              <option value="Reinscripción">Reinscripción</option>
              <!-- Puedes agregar más si tu universidad maneja Bajas, Egresados, etc. -->
            </select>
          </div>

          <button type="submit" id="btn-submit-edit" class="btn btn-save">Guardar Cambios</button>
        </form>
      </div>
    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbzjc0VvXZ42h4JcJyAnWm0hnqM115AJsb8oFGe2d6n4ss9YBKDBtH8HNmC0c0TZU7KCsQ/exec";
      
      let dataGlobal = [];
      let currentSortColumn = 'fecha';
      let currentSortAsc = false; // Falso = los más recientes primero

      // 1. Cargar Datos
      function cargarDatos() {
        fetch(API_URL)
          .then(res => res.json())
          .then(json => {
            if (json.status === "success") {
              dataGlobal = json.data;
              generarFiltrosDinamicos(dataGlobal);
              procesarFiltros();
            }
          })
          .catch(err => {
            document.getElementById("tabla-body").innerHTML = `<tr><td colspan="8" style="text-align:center; color:red; padding:20px;">Error de conexión. Revisa tu red o el App Script.</td></tr>`;
          });
      }

      // 2. Poblar los <select> automáticamente
      function generarFiltrosDinamicos(datos) {
        const cursos = new Set(), estatus = new Set(), asesores = new Set();
        
        datos.forEach(a => {
          if(a.curso) cursos.add(a.curso.trim());
          if(a.status) estatus.add(a.status.trim());
          if(a.asesor) asesores.add(a.asesor.trim());
        });

        llenarSelect('filterCurso', cursos, 'Todos los Cursos');
        llenarSelect('filterStatus', estatus, 'Todos los Estatus');
        llenarSelect('filterAsesor', asesores, 'Todos los Asesores');
      }

      function llenarSelect(id, setDatos, textoDefault) {
        const select = document.getElementById(id);
        select.innerHTML = `<option value="ALL">${textoDefault}</option>`;
        Array.from(setDatos).sort().forEach(item => {
          if(item) select.innerHTML += `<option value="${item}">${item}</option>`;
        });
      }

      // 3. Normalizador para Búsqueda (Quita acentos y pasa a minúsculas)
      function normalizar(texto) {
        if (!texto) return "";
        return String(texto).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      }

      // 4. Lógica Maestra de Filtrado y Ordenamiento
      function procesarFiltros() {
        const txtBuscar = normalizar(document.getElementById("searchInput").value);
        const terminosBusqueda = txtBuscar.split(" ").filter(t => t.length > 0);
        
        const fCurso = document.getElementById("filterCurso").value;
        const fStatus = document.getElementById("filterStatus").value;
        const fAsesor = document.getElementById("filterAsesor").value;

        // A) Filtrar
        let filtrados = dataGlobal.filter(a => {
          // Evaluar Selects
          const pasaCurso = (fCurso === "ALL" || String(a.curso).trim() === fCurso);
          const pasaStatus = (fStatus === "ALL" || String(a.status).trim() === fStatus);
          const pasaAsesor = (fAsesor === "ALL" || String(a.asesor).trim() === fAsesor);

          // Evaluar Búsqueda Avanzada (Busca en cualquier propiedad)
          let cadenaTotal = normalizar(`${a.nombreCompleto} ${a.idRegistro} ${a.matricula} ${a.curso} ${a.asesor}`);
          const pasaTexto = terminosBusqueda.every(termino => cadenaTotal.includes(termino));

          return pasaCurso && pasaStatus && pasaAsesor && pasaTexto;
        });

        // B) Ordenar
        filtrados.sort((a, b) => {
          let valA = String(a[currentSortColumn] || "").toLowerCase();
          let valB = String(b[currentSortColumn] || "").toLowerCase();
          if (valA < valB) return currentSortAsc ? -1 : 1;
          if (valA > valB) return currentSortAsc ? 1 : -1;
          return 0;
        });

        // C) Renderizar
        renderizarTabla(filtrados);
        actualizarIconosOrden();
      }

      // 5. Renderizador de Tabla
      function renderizarTabla(datos) {
        const tbody = document.getElementById("tabla-body");
        tbody.innerHTML = "";
        
        // Contadores
        let sinArchivosCount = datos.filter(a => !a.urlExpediente || String(a.urlExpediente).trim() === "").length;
        document.getElementById("contador").innerHTML = `Registros: <strong>${datos.length}</strong> | Pendientes: <strong style="color:var(--upm-red);">${sinArchivosCount}</strong>`;

        if (datos.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:#666;">No se encontraron registros con esos filtros.</td></tr>`;
          return;
        }

        datos.forEach(alumno => {
          let matStr = alumno.matricula ? String(alumno.matricula).trim() : "";
          let tieneMat = matStr !== "" && normalizar(matStr) !== "no matriculado";
          let semaforoMatricula = tieneMat ? `<span class="badge badge-green">${matStr}</span>` : `<span class="badge badge-yellow">Pendiente</span>`;

          // Lógica "Sin Archivos"
          let tieneArchivos = alumno.urlExpediente && String(alumno.urlExpediente).trim() !== "";
          let claseFila = tieneArchivos ? "" : "row-missing-files";
          
          let botonDrive = tieneArchivos 
            ? `<a href="${alumno.urlExpediente}" target="_blank" class="btn btn-drive">Drive</a>` 
            : `<button class="btn btn-missing" disabled>Faltan Archivos</button>`;

          let botonEditar = `<button class="btn btn-edit" onclick='abrirModal(${JSON.stringify(alumno)})'>Editar</button>`;

          tbody.innerHTML += `
            <tr class="${claseFila}">
              <td style="color:#555; font-size:11px; font-weight:bold;">${alumno.idRegistro}</td>
              <td><strong>${alumno.nombreCompleto}</strong></td>
              <td>${semaforoMatricula}</td>
              <td style="font-size:12px;">${alumno.curso}</td>
              <td><span class="badge badge-blue">${alumno.status}</span></td>
              <td style="color:#666; font-size:11px;">${alumno.fecha}</td>
              <td style="font-size:12px;">${alumno.asesor}</td>
              <td style="white-space:nowrap;">${botonDrive} ${botonEditar}</td>
            </tr>
          `;
        });
      }

      // 6. Ordenamiento de Cabeceras
      function cambiarOrden(columna) {
        if (currentSortColumn === columna) {
          currentSortAsc = !currentSortAsc; // Invertir orden si es la misma
        } else {
          currentSortColumn = columna;
          currentSortAsc = true; // Por defecto ascendente al cambiar columna
        }
        procesarFiltros();
      }

      function actualizarIconosOrden() {
        document.querySelectorAll('.sort-icon').forEach(el => el.innerText = "");
        const iconoActivo = document.getElementById(`sort-${currentSortColumn}`);
        if(iconoActivo) {
          iconoActivo.innerText = currentSortAsc ? "▲" : "▼";
        }
      }

      // 7. Modal de Edición
      function abrirModal(alumno) {
        document.getElementById("edit-id").value = alumno.idRegistro;
        document.getElementById("edit-nombre").value = `[${alumno.idRegistro}] ${alumno.nombreCompleto}`;
        
        let matStr = alumno.matricula ? String(alumno.matricula).trim() : "";
        document.getElementById("edit-matricula").value = normalizar(matStr) === "no matriculado" ? "" : matStr;
        
        // Evitar que el select se rompa si el status no existe en las opciones predefinidas
        let selStatus = document.getElementById("edit-status");
        if(!Array.from(selStatus.options).some(opt => opt.value === alumno.status)) {
            selStatus.innerHTML += `<option value="${alumno.status}">${alumno.status}</option>`;
        }
        selStatus.value = alumno.status;

        document.getElementById("editModal").style.display = "flex";
      }

      function cerrarModal() {
        document.getElementById("editModal").style.display = "none";
      }

      // 8. Guardar Edición (Backend)
      function guardarEdicion(e) {
        e.preventDefault();
        const btn = document.getElementById("btn-submit-edit");
        btn.innerText = "Guardando...";
        btn.disabled = true;

        const payload = {
          action: "update",
          idRegistro: document.getElementById("edit-id").value,
          matricula: document.getElementById("edit-matricula").value || "No Matriculado",
          status: document.getElementById("edit-status").value,
        };

        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        })
        .then(res => res.json())
        .then(response => {
          if (response.status === "success") {
            cerrarModal();
            cargarDatos(); // Refresca toda la tabla
          } else {
            alert("Error del servidor: " + response.message);
          }
        })
        .catch(err => alert("Ocurrió un error de red al intentar guardar."))
        .finally(() => {
          btn.innerText = "Guardar Cambios";
          btn.disabled = false;
        });
      }

      // Iniciar App
      cargarDatos();
    </script>
  </body>
</html>
